{% extends "admin/base.html" %}
{% load static %}

{% block title %}管理员入口 - uniTokenHub{% endblock %}

{% block branding %}
<h1 id="site-name"><a href="{% url 'admin:index' %}">uniTokenHub 管理后台</a></h1>
{% endblock %}

{% block content %}
<div class="p-4">
    <h1 class="text-2xl font-bold mb-6">管理员入口</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
        <!-- 进入用户端 -->
        <a href="/" target="_blank" class="block p-6 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">
            <h2 class="text-xl font-semibold mb-2">进入用户端</h2>
            <p class="text-blue-100">在新窗口打开用户前端页面</p>
        </a>
        
        <!-- 模型管理 -->
        <a href="{% url 'admin:ai_models_aimodel_changelist' %}" class="block p-6 bg-green-500 text-white rounded-lg hover:bg-green-600 transition">
            <h2 class="text-xl font-semibold mb-2">AI模型管理</h2>
            <p class="text-green-100">管理AI模型、供应商和分类</p>
        </a>
        
        <!-- 用户管理 -->
        <a href="{% url 'admin:users_user_changelist' %}" class="block p-6 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition">
            <h2 class="text-xl font-semibold mb-2">用户管理</h2>
            <p class="text-purple-100">查看和管理注册用户</p>
        </a>
        
        <!-- 仪表盘 -->
        <a href="/api/dashboard/" class="block p-6 bg-orange-500 text-white rounded-lg hover:bg-orange-600 transition">
            <h2 class="text-xl font-semibold mb-2">API仪表盘</h2>
            <p class="text-orange-100">查看API使用统计数据</p>
        </a>
    </div>
</div>
{% endblock %}
